<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Rakshak AI operational flow</title>
  <desc id="desc">An emergency moves through reporting, AI-assisted triage, dispatch, hospital matching, transport, and review.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0891b2"/><stop offset="1" stop-color="#14b8a6"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity=".12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#0e7490"/></marker></defs>
  <rect width="1600" height="520" rx="28" fill="url(#bg)"/><text x="70" y="72" fill="#0f172a" font-family="Inter,Segoe UI,sans-serif" font-size="38" font-weight="800">From incident signal to coordinated response</text><text x="70" y="110" fill="#475569" font-family="Inter,Segoe UI,sans-serif" font-size="20">A shared operational record follows the emergency across teams and decision points.</text><path d="M165 272H1435" stroke="url(#line)" stroke-width="7" stroke-linecap="round" opacity=".45"/>
  <g font-family="Inter,Segoe UI,sans-serif" filter="url(#shadow)">
    <g transform="translate(55 180)"><rect width="230" height="190" rx="24" fill="#fff" stroke="#bae6fd"/><circle cx="115" cy="0" r="39" fill="#dc2626"/><path d="M115-19v24M115 19h.1" stroke="#fff" stroke-width="8" stroke-linecap="round"/><text x="115" y="77" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="800">Incident report</text><text x="115" y="112" text-anchor="middle" fill="#64748b" font-size="15">Caller, field unit, IoT,</text><text x="115" y="136" text-anchor="middle" fill="#64748b" font-size="15">or control-room intake</text></g>
    <g transform="translate(370 180)"><rect width="230" height="190" rx="24" fill="#fff" stroke="#bae6fd"/><circle cx="115" cy="0" r="39" fill="#7c3aed"/><path d="M98-8c10-17 34-8 31 8 13 5 8 25-4 25h-25c-17 0-20-25-2-33z" fill="none" stroke="#fff" stroke-width="5"/><text x="115" y="77" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="800">AI-assisted triage</text><text x="115" y="112" text-anchor="middle" fill="#64748b" font-size="15">Priority, severity, rationale,</text><text x="115" y="136" text-anchor="middle" fill="#64748b" font-size="15">and human review</text></g>
    <g transform="translate(685 180)"><rect width="230" height="190" rx="24" fill="#fff" stroke="#bae6fd"/><circle cx="115" cy="0" r="39" fill="#0e7490"/><path d="M92 7h48M98-7h27l12 14v18H94V-1z" stroke="#fff" stroke-width="5" fill="none"/><circle cx="105" cy="25" r="6" fill="#fff"/><circle cx="129" cy="25" r="6" fill="#fff"/><text x="115" y="77" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="800">Smart dispatch</text><text x="115" y="112" text-anchor="middle" fill="#64748b" font-size="15">Vehicle fit, readiness, route,</text><text x="115" y="136" text-anchor="middle" fill="#64748b" font-size="15">and mission assignment</text></g>
    <g transform="translate(1000 180)"><rect width="230" height="190" rx="24" fill="#fff" stroke="#bae6fd"/><circle cx="115" cy="0" r="39" fill="#059669"/><path d="M91 20h48M97 20V-12h36v32M108-12v-13h14v13M115-7V8M107 .5h16" stroke="#fff" stroke-width="5" fill="none"/><text x="115" y="77" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="800">Hospital match</text><text x="115" y="112" text-anchor="middle" fill="#64748b" font-size="15">Capability, capacity, bed,</text><text x="115" y="136" text-anchor="middle" fill="#64748b" font-size="15">and receiving alert</text></g>
    <g transform="translate(1315 180)"><rect width="230" height="190" rx="24" fill="#fff" stroke="#bae6fd"/><circle cx="115" cy="0" r="39" fill="#d97706"/><path d="M96 10l13 13 25-37" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="115" y="77" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="800">Review + learn</text><text x="115" y="112" text-anchor="middle" fill="#64748b" font-size="15">Timeline, audit, analytics,</text><text x="115" y="136" text-anchor="middle" fill="#64748b" font-size="15">and after-action insight</text></g>
  </g>
  <g stroke="#0e7490" stroke-width="4" marker-end="url(#arrow)"><path d="M290 275h62"/><path d="M605 275h62"/><path d="M920 275h62"/><path d="M1235 275h62"/></g><rect x="390" y="430" width="820" height="52" rx="26" fill="#083344"/><text x="800" y="463" text-anchor="middle" fill="#ccfbf1" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">Live status, alerts, GIS context, and resource availability remain visible throughout</text>
</svg>
